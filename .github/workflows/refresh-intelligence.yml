name: Refresh Opportunity Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "27 12 * * *"
  workflow_run:
    workflows:
      - Refresh Mississippi Procurement
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: project-radar-intelligence
  cancel-in-progress: false

jobs:
  intelligence:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build contractor opportunity intelligence
        run: |
          chmod +x run_intelligence_pipeline.sh
          ./run_intelligence_pipeline.sh

      - name: Commit derived intelligence
        run: |
          git config user.name "project-radar-bot"
          git config user.email "project-radar-bot@users.noreply.github.com"

          git add \
            data/raw/mda_business_news_candidates.json \
            data/raw/mda_business_news_vertical_candidates.json \
            data/review/mda_business_news_normalization_review.json \
            data/intelligence/source_health.json \
            data/intelligence/source_performance.json \
            data/intelligence/source_records.json \
            data/intelligence/source_records_geocoded.json \
            data/intelligence/canonical_projects.json \
            data/intelligence/opportunities.json \
            data/intelligence/rejected.json \
            data/intelligence/duplicates.json \
            data/intelligence/daily_brief.json \
            data/intelligence/pursuit_cards.json \
            data/intelligence/trackwatch_attention.json \
            data/intelligence/trackwatch_metrics.json \
            state/trackwatch_attention_state.json \
            data/intelligence/scope_evidence.json \
            data/intelligence/trade_matches.json \
            data/intelligence/trade_coverage_report.json

          if git diff --cached --quiet; then
            echo "No intelligence changes to commit"
          else
            git commit -m "Auto-refresh contractor opportunity intelligence"
            git push
          fi
