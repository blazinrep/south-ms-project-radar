name: Refresh Opportunity Intelligence

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Refresh Mississippi Procurement
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: project-radar-intelligence
  cancel-in-progress: false

jobs:
  intelligence:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build contractor opportunity intelligence
        run: |
          chmod +x run_intelligence_pipeline.sh
          ./run_intelligence_pipeline.sh

      - name: Commit derived intelligence
        run: |
          git config user.name "project-radar-bot"
          git config user.email "project-radar-bot@users.noreply.github.com"

          git add \
            data/intelligence/opportunities.json \
            data/intelligence/rejected.json \
            data/intelligence/duplicates.json \
            data/intelligence/daily_brief.json \
            data/intelligence/pursuit_cards.json

          if git diff --cached --quiet; then
            echo "No intelligence changes to commit"
          else
            git commit -m "Auto-refresh contractor opportunity intelligence"
            git push
          fi
